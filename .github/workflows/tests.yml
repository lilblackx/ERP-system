name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  DB_SERVER: localhost,1433
  DB_NAME: distribuidora_dj
  DB_USER: sa
  # Solo para el contenedor efimero de este workflow -- nunca se usa contra una base real.
  DB_PASSWORD: "CIPassword123*"
  DB_DRIVER: ODBC Driver 18 for SQL Server
  DB_TRUST_SERVER_CERTIFICATE: "yes"
  DB_TRUSTED_CONNECTION: "no"
  # pytest-qt (tests/ui/test_numeric_inputs.py y demas tests de widgets) instancia
  # QApplication real -- QT_QPA_PLATFORM=offscreen es más estable que xcb en CI headless
  # cuando se tienen las librerías EGL instaladas.
  QT_QPA_PLATFORM: offscreen
  # QtWebEngine/Chromium dentro del runner (los tests de UI crean MapaWidget/QWebEngineView):
  # /dev/shm de los contenedores es pequeno y Chromium segfaulta al agotarlo en teardown
  # (los "node down" de xdist en CI). --disable-dev-shm-usage lo evita; --no-sandbox es
  # requerido corriendo como root en contenedor. app/main.py usa setdefault, asi que este
  # valor (que ya incluye --disable-gpu) no lo pisa.
  QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox --disable-dev-shm-usage"

# Una corrida nueva del mismo PR/rama cancela la anterior: no se gastan minutos en commits ya superados.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # La suite completa en un solo runner (~2700 tests, Qt + SQL Server compartiendo
    # los 4 vCPU) tarda ~31 min: 30 quedaba corto y GitHub cancelaba el job al 96%.
    timeout-minutes: 60
    # Fijo en 22.04 (no ubuntu-latest): el paquete msodbcsql18 de Microsoft se instala
    # contra una version de Ubuntu especifica -- ubuntu-latest podria saltar a una
    # version mas nueva sin aviso y romper la instalacion del driver.
    runs-on: ubuntu-22.04

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CIPassword123*"
          # Developer, no Express: Express limita el buffer pool a ~1.4GB y CPU/sockets --
          # bajo la suite completa (850+ tests, cada uno con DELETE masivo en cascada de
          # triggers sobre 60+ tablas via tests/conftest.py) el proceso sqlservr crasheaba
          # en pleno run sin loggear shutdown graceful, mismo sintoma reproducido y
          # diagnosticado en local (ver docker-compose.yml). Developer es gratis para uso
          # no productivo -- exactamente este caso, un contenedor efimero de CI -- y no
          # impone esos limites artificiales.
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v6

      # pyodbc necesita el driver ODBC instalado en el SO -- no es un paquete pip (ver
      # README.md, seccion Requisitos). Los runners ubuntu-22.04 de GitHub YA traen
      # preconfigurado el repo de packages.microsoft.com (confirmado con el error real de
      # un intento anterior: "Conflicting values set for option Signed-By ... source
      # https://packages.microsoft.com/ubuntu/22.04/prod/ jammy: /usr/share/keyrings/
      # microsoft-prod.gpg != " -- ese repo ya trae msodbcsql17/18). Agregar el repo de
      # nuevo (con un key/signed-by propio) duplica la fuente y choca con la que ya
      # existe. No hace falta: alcanza con actualizar e instalar directo.
      #
      # ACCEPT_EULA=Y va DESPUES de sudo, no antes: "ACCEPT_EULA=Y sudo apt-get ..."
      # fija la variable para el propio comando `sudo`, que por diseño no la propaga al
      # proceso que ejecuta como root -- el postinst de msodbcsql18 nunca ve el EULA
      # aceptado y no registra el driver en odbcinst.ini, aunque apt termine con exit 0.
      #
      # Driver ODBC y librerias de Qt (pytest-qt instancia QApplication real, con xvfb como
      # respaldo de framebuffer) en UNA sola llamada a apt: un solo update y una sola
      # resolucion de dependencias.
      - name: Instalar ODBC Driver 18 y dependencias de Qt
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 libegl1 libgl1-mesa-glx libxcb-xinerama0 xvfb

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # Cache de pip atada al lock: si requirements-dev-lock.txt no cambia, no se vuelven a
          # descargar PySide6 y compania (lo mas pesado de la instalacion).
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      # requirements-dev-lock.txt (C9): freeze completo con transitivas, para que el
      # entorno de CI sea el mismo bit a bit que el que corrio la suite localmente.
      - name: Instalar dependencias
        run: pip install -r requirements-dev-lock.txt

      # C16: ruff (lint + format), config en pyproject.toml. No requiere la base de datos
      # -- corre antes que los tests para fallar rapido si hay un problema de estilo.
      - name: Lint (ruff check)
        run: ruff check .

      - name: Formato (ruff format --check)
        run: ruff format --check .

      # No hace falta crear la base ni correr schema_sqlserver.sql a mano:
      # tests/conftest.py (fixture test_engine) crea distribuidora_dj_test y aplica el
      # schema + migraciones pendientes automaticamente la primera vez que corren los
      # tests, igual que en local.
      # Suite completa en paralelo, igual que en local (pytest -n 6 --dist loadfile, ver
      # README.md): cada worker de pytest-xdist usa SU propia base (distribuidora_dj_test_gw0,
      # _gw1, ...) y --dist loadfile manda todos los tests de un archivo al mismo worker, que
      # es lo que la limpieza por DELETE de tests/conftest.py necesita. -n auto toma los
      # nucleos del runner (2 o 4 segun el plan), asi no se sobrecarga el SQL Server que
      # comparte maquina con los tests. Servicios y UI van juntos: ya no hay que separarlos.
      # --durations muestra los tests mas lentos para detectar regresiones de tiempo.
      # -n auto = un worker por vCPU del runner (4). -n 8 se probo y fue PEOR (~59 min,
      # timeout): 8 bases de prueba migrando a la vez saturan el SQL Server del runner
      # y los tests de Qt hacen thrashing. No subir de ahi.
      # --max-worker-restart: los workers de xdist a veces mueren con segfault de Qt
      # (PySide6/QWebEngine en teardown, flaky -- ya tumbó gw3 y gw1 en corridas
      # distintas). Sin esto un solo crash mata la suite entera; con esto xdist levanta
      # otro worker y reparte el trabajo -- el test que estaba en vuelo se reporta como
      # fallido/crashed pero el resto termina y se ve cual fue.
      - name: Correr la suite en paralelo
        run: pytest -n auto --dist loadfile --max-worker-restart=8 -q --durations=15
