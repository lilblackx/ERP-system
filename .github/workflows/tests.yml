name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  DB_SERVER: localhost,1433
  DB_NAME: distribuidora_dj
  DB_USER: sa
  # Solo para el contenedor efimero de este workflow -- nunca se usa contra una base real.
  DB_PASSWORD: "CIPassword123*"
  DB_DRIVER: ODBC Driver 18 for SQL Server
  DB_TRUST_SERVER_CERTIFICATE: "yes"
  DB_TRUSTED_CONNECTION: "no"

jobs:
  test:
    # Fijo en 22.04 (no ubuntu-latest): el paquete msodbcsql18 de Microsoft se instala
    # contra una version de Ubuntu especifica -- ubuntu-latest podria saltar a una
    # version mas nueva sin aviso y romper la instalacion del driver.
    runs-on: ubuntu-22.04

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CIPassword123*"
          # Developer, no Express: Express limita el buffer pool a ~1.4GB y CPU/sockets --
          # bajo la suite completa (850+ tests, cada uno con DELETE masivo en cascada de
          # triggers sobre 60+ tablas via tests/conftest.py) el proceso sqlservr crasheaba
          # en pleno run sin loggear shutdown graceful, mismo sintoma reproducido y
          # diagnosticado en local (ver docker-compose.yml). Developer es gratis para uso
          # no productivo -- exactamente este caso, un contenedor efimero de CI -- y no
          # impone esos limites artificiales.
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      # pyodbc necesita el driver ODBC instalado en el SO -- no es un paquete pip (ver
      # README.md, seccion Requisitos). Los runners ubuntu-22.04 de GitHub YA traen
      # preconfigurado el repo de packages.microsoft.com (confirmado con el error real de
      # un intento anterior: "Conflicting values set for option Signed-By ... source
      # https://packages.microsoft.com/ubuntu/22.04/prod/ jammy: /usr/share/keyrings/
      # microsoft-prod.gpg != " -- ese repo ya trae msodbcsql17/18). Agregar el repo de
      # nuevo (con un key/signed-by propio) duplica la fuente y choca con la que ya
      # existe. No hace falta: alcanza con actualizar e instalar directo.
      #
      # ACCEPT_EULA=Y va DESPUES de sudo, no antes: "ACCEPT_EULA=Y sudo apt-get ..."
      # fija la variable para el propio comando `sudo`, que por diseño no la propaga al
      # proceso que ejecuta como root -- el postinst de msodbcsql18 nunca ve el EULA
      # aceptado y no registra el driver en odbcinst.ini, aunque apt termine con exit 0.
      - name: Instalar ODBC Driver 18 para SQL Server
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # requirements-dev-lock.txt (C9): freeze completo con transitivas, para que el
      # entorno de CI sea el mismo bit a bit que el que corrio la suite localmente.
      - name: Instalar dependencias
        run: pip install -r requirements-dev-lock.txt

      # C16: ruff (lint + format), config en pyproject.toml. No requiere la base de datos
      # -- corre antes que los tests para fallar rapido si hay un problema de estilo.
      - name: Lint (ruff check)
        run: ruff check .

      - name: Formato (ruff format --check)
        run: ruff format --check .

      # No hace falta crear la base ni correr schema_sqlserver.sql a mano:
      # tests/conftest.py (fixture test_engine) crea distribuidora_dj_test y aplica el
      # schema + migraciones pendientes automaticamente la primera vez que corren los
      # tests, igual que en local.
      - name: Correr suite de tests
        run: pytest -q
