name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  DB_SERVER: localhost,1433
  DB_NAME: distribuidora_dj
  DB_USER: sa
  # Solo para el contenedor efimero de este workflow -- nunca se usa contra una base real.
  DB_PASSWORD: "CIPassword123*"
  DB_DRIVER: ODBC Driver 18 for SQL Server
  DB_TRUST_SERVER_CERTIFICATE: "yes"
  DB_TRUSTED_CONNECTION: "no"
  # pytest-qt (tests/ui/test_numeric_inputs.py y demas tests de widgets) instancia
  # QApplication real -- QT_QPA_PLATFORM=offscreen es más estable que xcb en CI headless
  # cuando se tienen las librerías EGL instaladas.
  QT_QPA_PLATFORM: offscreen

# Una corrida nueva del mismo PR/rama cancela la anterior: no se gastan minutos en commits ya superados.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint primero y en su propio job: falla en ~1 min sin esperar a los tests, y corre en
  # paralelo con ellos (un fallo de estilo no bloquea ni retrasa la suite).
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - run: pip install -r requirements-dev-lock.txt
      - name: Lint (ruff check)
        run: ruff check .
      - name: Formato (ruff format --check)
        run: ruff format --check .

  # Los tests marcados "not db" no tocan SQL Server (la mayoria de tests/ui usa sesiones
  # MagicMock): corren en un job SIN el servicio sqlserver, asi no compiten por CPU/disco
  # con el contenedor y cada runner va a su maxima velocidad. En paralelo con el otro job
  # el wall-clock total es ~la mitad que la suite unica.
  tests-sin-base:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    # SQL Server tambien aqui aunque los tests "not db" no lo usen: hay tests que no
    # llevan el fixture db_session (y por tanto no quedan marcados "db") pero igual
    # abren una conexion real -- sin servidor esas conexiones quedan colgadas en el
    # timeout de login de pyodbc y el job nunca termina (visto en la primera corrida:
    # 96% y >10 min). Con el servicio presente esas conexiones resuelven al instante;
    # el contenedor queda idle, no roba CPU a los tests.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CIPassword123*"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      # Mismo apt que el job con base: los tests de UI instancian QApplication real y
      # necesitan las librerias de Qt; pyodbc se importa aunque no haya driver configurado.
      - name: Instalar ODBC Driver 18 y dependencias de Qt
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 libegl1 libgl1-mesa-glx libxcb-xinerama0 xvfb
      - name: Instalar dependencias
        run: pip install -r requirements-dev-lock.txt
      # -m "not db" excluye los tests que usan el fixture db_session (marcados por
      # pytest_collection_modifyitems en tests/conftest.py). -n auto --dist loadfile:
      # cada worker de pytest-xdist queda con archivos completos, que es lo que la
      # limpieza por DELETE necesita; aca cada worker ni siquiera comparte base.
      - name: Correr tests sin base de datos
        run: pytest -m "not db" -n auto --dist loadfile -q --durations=15

  # Los tests con db_session necesitan SQL Server: servicio efimero por job, cada worker
  # de xdist usa SU propia base (distribuidora_dj_test_gw0, _gw1, ...) que crea
  # tests/conftest.py (fixture test_engine) aplicando schema + migraciones.
  tests-con-base:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CIPassword123*"
          # Developer, no Express: Express limita el buffer pool a ~1.4GB y CPU/sockets --
          # bajo la suite completa (850+ tests, cada uno con DELETE masivo en cascada de
          # triggers sobre 60+ tablas via tests/conftest.py) el proceso sqlservr crasheaba
          # en pleno run sin loggear shutdown graceful, mismo sintoma reproducido y
          # diagnosticado en local (ver docker-compose.yml). Developer es gratis para uso
          # no productivo -- exactamente este caso, un contenedor efimero de CI -- y no
          # impone esos limites artificiales.
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      # pyodbc necesita el driver ODBC instalado en el SO -- no es un paquete pip (ver
      # README.md, seccion Requisitos). Los runners ubuntu-22.04 de GitHub YA traen
      # preconfigurado el repo de packages.microsoft.com (confirmado con el error real de
      # un intento anterior: "Conflicting values set for option Signed-By ... source
      # https://packages.microsoft.com/ubuntu/22.04/prod/ jammy: /usr/share/keyrings/
      # microsoft-prod.gpg != " -- ese repo ya trae msodbcsql17/18). Agregar el repo de
      # nuevo (con un key/signed-by propio) duplica la fuente y choca con la que ya
      # existe. No hace falta: alcanza con actualizar e instalar directo.
      #
      # ACCEPT_EULA=Y va DESPUES de sudo, no antes: "ACCEPT_EULA=Y sudo apt-get ..."
      # fija la variable para el propio comando `sudo`, que por diseño no la propaga al
      # proceso que ejecuta como root -- el postinst de msodbcsql18 nunca ve el EULA
      # aceptado y no registra el driver en odbcinst.ini, aunque apt termine con exit 0.
      #
      # Driver ODBC y librerias de Qt (pytest-qt instancia QApplication real, con xvfb como
      # respaldo de framebuffer) en UNA sola llamada a apt: un solo update y una sola
      # resolucion de dependencias.
      - name: Instalar ODBC Driver 18 y dependencias de Qt
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 libegl1 libgl1-mesa-glx libxcb-xinerama0 xvfb
      - name: Instalar dependencias
        run: pip install -r requirements-dev-lock.txt
      # Suite con base en paralelo: -n auto toma los nucleos del runner y
      # --dist loadfile manda todos los tests de un archivo al mismo worker, que es lo
      # que la limpieza por DELETE de tests/conftest.py necesita. --durations muestra
      # los tests mas lentos para detectar regresiones de tiempo.
      - name: Correr la suite con base de datos
        run: pytest -m db -n auto --dist loadfile -q --durations=15
