name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  DB_SERVER: localhost,1433
  DB_NAME: distribuidora_dj
  DB_USER: sa
  # Solo para el contenedor efimero de este workflow -- nunca se usa contra una base real.
  DB_PASSWORD: "CIPassword123*"
  DB_DRIVER: ODBC Driver 18 for SQL Server
  DB_TRUST_SERVER_CERTIFICATE: "yes"
  DB_TRUSTED_CONNECTION: "no"

jobs:
  test:
    # Fijo en 22.04 (no ubuntu-latest): el paquete msodbcsql18 de Microsoft se instala
    # contra una version de Ubuntu especifica -- ubuntu-latest podria saltar a una
    # version mas nueva sin aviso y romper la instalacion del driver.
    runs-on: ubuntu-22.04

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CIPassword123*"
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      # pyodbc necesita el driver ODBC instalado en el SO -- no es un paquete pip (ver
      # README.md, seccion Requisitos). Metodo oficial de Microsoft para Ubuntu 22.04
      # (learn.microsoft.com, "Install the Microsoft ODBC driver for SQL Server (Linux)").
      # Usa /etc/apt/trusted.gpg.d en vez de un keyring con signed-by propio: los runners
      # ubuntu-22.04 de GitHub ya traen un repo de packages.microsoft.com preconfigurado
      # (para .NET/PowerShell/Azure CLI) con su propio keyring -- agregar un signed-by
      # nuevo para la misma URL choca con eso ("Conflicting values set for option
      # Signed-By") y hace fallar apt-get update.
      #
      # ACCEPT_EULA=Y va DESPUES de sudo, no antes: "ACCEPT_EULA=Y sudo apt-get ..."
      # fija la variable para el propio comando `sudo`, que por diseño no la propaga al
      # proceso que ejecuta como root -- el postinst de msodbcsql18 nunca ve el EULA
      # aceptado y no registra el driver en odbcinst.ini, aunque apt termine con exit 0.
      # Sintoma real visto en el primer run verde-falso: pyodbc fallaba con "Can't open
      # lib 'ODBC Driver 18 for SQL Server' : file not found" en cuanto corrian los tests.
      - name: Instalar ODBC Driver 18 para SQL Server
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # requirements-dev-lock.txt (C9): freeze completo con transitivas, para que el
      # entorno de CI sea el mismo bit a bit que el que corrio la suite localmente.
      - name: Instalar dependencias
        run: pip install -r requirements-dev-lock.txt

      # DIAGNOSTICO TEMPORAL: el run anterior (c40fb52) tuvo el paso de instalar el
      # driver en "success" pero pytest fallaba igual con "file not found" para el
      # driver -- evidencia directa de lo que ve pyodbc en el runner real, para no
      # seguir adivinando la causa.
      - name: Diagnostico ODBC
        run: |
          echo "::notice::odbcinst -j: $(odbcinst -j 2>&1 | tr '\n' ' ')"
          echo "::notice::odbcinst.ini: $(cat /etc/odbcinst.ini 2>&1 | tr '\n' ' ')"
          echo "::notice::ls msodbcsql: $(ls -la /opt/microsoft/msodbcsql18/lib64/ 2>&1 | tr '\n' ' ')"
          echo "::notice::pyodbc.drivers(): $(python -c 'import pyodbc; print(pyodbc.drivers())' 2>&1 | tr '\n' ' ')"

      # No hace falta crear la base ni correr schema_sqlserver.sql a mano:
      # tests/conftest.py (fixture test_engine) crea distribuidora_dj_test y aplica el
      # schema + migraciones pendientes automaticamente la primera vez que corren los
      # tests, igual que en local.
      - name: Correr suite de tests
        run: pytest -q
