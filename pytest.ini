[pytest]
testpaths = tests
pythonpath = .
qt_api = pyside6
qt_qapp_instance = true
qt_default_raising = false
# Paralelo por defecto (pytest-xdist, en requirements-dev.txt): un worker por archivo
# (--dist loadfile es lo que la limpieza por DELETE de tests/conftest.py necesita).
# Para correr secuencial (debug, un solo test): pytest -n0 ...
addopts = -p no:warnings --tb=short -n auto --dist loadfile
markers =
    db: usa la base de datos de pruebas (fixture db_session)

# Rapido (todos los nucleos, una base por worker):  pytest -n 6 --dist loadfile
# Solo lo que no toca la base:                       pytest -m "not db"
